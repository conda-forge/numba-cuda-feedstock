context:
  name: numba-cuda
  sdist_name: numba_cuda
  version: "0.30.4"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/NVIDIA/numba-cuda/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 52a41fdb295144fd68a86ee4d66b02bf88d58f885feb13adf815edb3f4ea31af

build:
  script:
    # Same workaround for liblto_plugin.so not found during cross-compiling as in
    # conda-forge/libnvshmem-feedstock#35.
    - if: build_platform != target_platform and target_platform == "linux-aarch64"
      then:
        - export CFLAGS="${CFLAGS} -fno-use-linker-plugin"
        - export CXXFLAGS="${CXXFLAGS} -fno-use-linker-plugin"
        - export LDFLAGS="${LDFLAGS} -fno-use-linker-plugin"
    - python -m pip install . -vv
  number: 1
  skip: [osx or ppc64le]

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
  host:
    - python
    - pip
    - setuptools
    - numpy >=2.1.0
  run:
    - python
    - numba >=0.60.0
    - numpy >=1.22,<2.5.0a0
    - cuda-bindings >=12.9.1,<14.0.0
    - cuda-core >=0.5.1,<2.0.0
    - cuda-cudart-dev
    - cuda-pathfinder >=1.4.0,<2.0.0
    - cuda-version >=12
    - cuda-nvcc-impl
    - packaging

tests:
  - python:
      imports:
        - numba_cuda
      pip_check: true

about:
  homepage: https://github.com/NVIDIA/numba-cuda
  summary: A CUDA target for Numba
  description: |
    A Numba target for compiling Python code to execute on CUDA GPUs.
  license: BSD-2-Clause
  license_file: LICENSE
  documentation: https://nvidia.github.io/numba-cuda
  repository: https://github.com/NVIDIA/numba-cuda

extra:
  recipe-maintainers:
    - brandon-b-miller
    - rparolin
    - conda-forge/cuda-python
    - leofang
    - bdice
    - gmarkall
    - vyasr
    - kkraus14
